name: Surfshark mail cleaner

permissions:
  actions: write
  contents: read

concurrency:
  group: surfshark-cleaner
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      run_seconds:
        description: 'How long to poll (seconds)'
        required: false
        default: '280'

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cryptography
      - run: python clean.py
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
          RUN_SECONDS: ${{ github.event.inputs.run_seconds || '280' }}
      - name: Chain next run
        if: always()
        run: gh workflow run clean.yml --repo "${{ github.repository }}" -f run_seconds=280
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
